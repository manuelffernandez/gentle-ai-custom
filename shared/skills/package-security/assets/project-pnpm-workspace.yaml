# Project-level pnpm baseline (requires allowBuilds support: pnpm 10.26+)
# Commit this into the repo so local installs, Docker, and CI behave the same.
#
# Important: this is intentionally DIFFERENT from npm.
# pnpm has an explicit allow/deny policy for dependency build scripts.
# strictDepBuilds requires pnpm 10.3+; verify the effective CLI supports both
# settings before relying on this policy.

# pnpm measures minimumReleaseAge in minutes (4320 = 3 days); npm uses days.
minimumReleaseAge: 4320
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Add only packages whose install/build scripts were reviewed and are required.
# Leaving this map absent means no dependency script is explicitly approved.

strictDepBuilds: true
saveExact: true
