# Global pnpm baseline
# Put this at ~/.config/pnpm/config.yaml
#
# Keep project-specific `allowBuilds` in the repo, not here.
# Both pnpm and supported npm releases offer reviewed script policies.
# pnpm uses `allowBuilds` + `strictDepBuilds`; npm's `allowScripts` policy is
# advisory unless supported `strict-allow-scripts` is enabled. Check the exact
# CLI features before relying on either policy.

minimumReleaseAge: 4320
trustPolicy: no-downgrade
blockExoticSubdeps: true
saveExact: true
